<div class="np-map-wrap">

  <!-- Map overlay controls -->
  @if (routeActive()) {
  <div class="np-map-overlay">
    <div class="map-start">
      <button class="np-btn np-btn-primary np-btn-sm" (click)="startJourneyFromMap()" [disabled]="startingJourney()">
        @if (startingJourney()) {
        <span class="np-spinner" style="width:14px;height:14px;border-width:2px"></span>
        }
        🚌 Inizia viaggio
      </button>
      <button class="np-btn np-btn-ghost np-btn-sm" (click)="clearRoute()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
        Cancella percorso
      </button>
    </div>

    <!-- Route options picker: only shows when there are multiple alternatives -->
    @if (routes().length > 1) {
    <div class="np-map-options">
      @for (route of routes(); track $index) {
      <button type="button" class="np-route-option " [class.np-route-option-active]="selectedIndex() === $index"
        (click)="selectRoute($index)">
        Opzione {{ $index + 1 }}
      </button>
      }
    </div>
    }



  </div>
  }

  @if (startJourneyError()) {
  <div class="np-map-error np-map-notification">
    {{ startJourneyError() }}
    <button (click)="startJourneyError.set(null)">×</button>
  </div>
  }



  @if (searching()) {
  <div class="np-map-searching np-map-notification">
    <span class="np-spinner"></span>
    Ricerca percorso in corso...
  </div>
  }

  @if (searchError()) {
  <div class="np-map-error np-map-notification">
    {{ searchError() }}
    <button (click)="searchError.set(null)">×</button>
  </div>
  }

  <div id="stop-map-container" class="np-map"></div>
</div>
